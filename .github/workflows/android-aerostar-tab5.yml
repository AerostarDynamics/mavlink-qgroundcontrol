name: Android-Aerostar-Tab5

# Aerostar build for the UXV Navigator Tab5 (Galaxy Tab Active5). Runs on every push to this branch, or by hand:
#   gh workflow run android-aerostar-tab5.yml --ref aerostar-navigator-tab5
on:
  workflow_dispatch:
  push:
    branches:
      - aerostar-navigator-tab5
    paths-ignore:
      - 'docs/**'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        BuildType: [Release]

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT: AerostarGCS-Tab5.apk
      PACKAGE: AerostarGCS-Tab5
      QT_VERSION: 6.8.3
      # Aerostar's own Tab5 release key (repo secrets AEROSTAR_TAB5_KEYSTORE_*, created 24 Oct 2026; backup in the Aerostar Drive)
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/../aerostar-tab5-release.p12
      QT_ANDROID_KEYSTORE_ALIAS: aerostartab5
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.AEROSTAR_TAB5_KEYSTORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.AEROSTAR_TAB5_KEYSTORE_PASSWORD }}
      # 64-bit only: the Galaxy Tab Active5 is arm64, and one ABI keeps the versionCode fixed (66xxxxxxx) so updates never look like a downgrade
      QT_ANDROID_ABIS: arm64-v8a

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history so 'git describe' finds the version tag (v5.0.8-AD-1.0)
          fetch-tags: true

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f # no --depth here: it would make the clone shallow again and hide the version tag

      - name: Restore Aerostar signing key
        if: env.QT_ANDROID_KEYSTORE_STORE_PASS != ''
        run: echo "${{ secrets.AEROSTAR_TAB5_KEYSTORE_BASE64 }}" | base64 -d > "$QT_ANDROID_KEYSTORE_PATH"

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Install Qt for Android
        uses: ./.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: ${{ env.QT_VERSION }}
          abis: ${{ env.QT_ANDROID_ABIS }}
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      # Qt's all_os Android packages (Qt 6.7+) unpack without execute bits, so qt-cmake etc. are refused
      - name: Make Qt tools executable
        run: find "${{ runner.temp }}/Qt" -path '*/bin/*' -type f -exec chmod +x {} + ; find "${{ runner.temp }}/Qt" -path '*/libexec/*' -type f -exec chmod +x {} +

      - name: Configure
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.BuildType }}
              -DCMAKE_WARN_DEPRECATED=FALSE
              -DQT_ANDROID_ABIS="${{ env.QT_ANDROID_ABIS }}"
              -DQT_ANDROID_BUILD_ALL_ABIS=OFF
              -DQT_HOST_PATH="${{ env.QT_ROOT_DIR }}/../gcc_64"
              -DQT_ANDROID_SIGN_APK=${{ env.QT_ANDROID_KEYSTORE_STORE_PASS != '' && 'ON' || 'OFF' }}
              -DQT_DEBUG_FIND_PACKAGE=ON
              -DQGC_STABLE_BUILD=ON

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: cmake --build . --target all --config ${{ matrix.BuildType }}

      - run: cp ${{ runner.temp }}/shadow_build_dir/android-build/*.apk ${{ runner.temp }}/shadow_build_dir/${{ env.ARTIFACT }}

      # Fallback only if the Aerostar key secrets are missing (e.g. a fork): sign with a throwaway key so the APK still installs.
      # A test-signed APK must be uninstalled before a properly signed build can be installed over it.
      - name: Test-sign APK (no release keystore)
        if: env.QT_ANDROID_KEYSTORE_STORE_PASS == ''
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          keytool -genkeypair -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=Aerostar Dynamics test build"
          APKSIGNER=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks test.keystore --ks-pass pass:testtest --out signed.apk ${{ env.ARTIFACT }}
          mv signed.apk ${{ env.ARTIFACT }}
          "$APKSIGNER" verify --print-certs ${{ env.ARTIFACT }}

      - name: Upload Build File
        if: matrix.BuildType == 'Release'
        uses: ./.github/actions/upload
        with:
          artifact_name: ${{ env.ARTIFACT }}
          package_name: ${{ env.PACKAGE }}
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
